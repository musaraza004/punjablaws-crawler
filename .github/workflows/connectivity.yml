name: Website connectivity
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check public site access
        shell: python
        run: |
          import concurrent.futures, time, urllib.request
          def check(url):
              started = time.monotonic()
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      body = response.read(1024)
                      print(url, 'status:', response.status, 'sample bytes:', len(body), 'elapsed:', time.monotonic()-started, flush=True)
                      return response.status == 200 and bool(body)
              except Exception as error:
                  print(url, type(error).__name__, str(error), flush=True)
                  return False
          urls = ['https://punjablaws.punjab.gov.pk/', 'http://punjablaws.punjab.gov.pk/', 'https://punjabcode.punjab.gov.pk/']
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              results = list(pool.map(check, urls))
          if not any(results):
              raise SystemExit('None of the public website endpoints is reachable from this runner.')
